<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; padding: 15px; color: #333; }
    p { margin-top: 0; font-size: 14px; }
    textarea { 
      width: 100%; 
      height: 200px; 
      margin-bottom: 15px; 
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      white-space: pre;
    }
    button { 
      padding: 10px 20px; 
      background: #8B0000; 
      color: white; 
      border: none; 
      border-radius: 4px;
      cursor: pointer; 
      font-weight: bold;
    }
    button:hover { background: #a83232; }
    #status { margin-top: 15px; font-weight: bold; white-space: pre-wrap; font-size: 14px;}
    .error { color: #cc0000; font-weight: normal; font-size: 12px; margin-top: 5px; }
  </style>
</head>
<body>
  <p>Paste a list of Student IDs to deactivate, one per line. They stay in the registry and keep their attendance history — only their status changes to Inactive.</p>

  <textarea id="dataInput" placeholder="2024001&#10;2024002&#10;2024003"></textarea>
  <button id="submitBtn" onclick="submitData()">Deactivate All</button>
  <div id="status"></div>

  <script>
    function submitData() {
      const data = document.getElementById('dataInput').value;
      const btn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('status');

      if (!data.trim()) {
        statusDiv.innerText = 'Please paste at least one student ID first.';
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Processing...';
      statusDiv.innerText = 'Updating registry...';

      google.script.run
        .withSuccessHandler(msg => {
          statusDiv.innerHTML = msg;
          btn.innerText = 'Done';
        })
        .withFailureHandler(err => {
          statusDiv.innerHTML = '<span style="color:red">Server Error: ' + err.message + '</span>';
          btn.disabled = false;
          btn.innerText = 'Deactivate All';
        })
        .processBulkDeactivation(data);
    }
  </script>
</body>
</html>
